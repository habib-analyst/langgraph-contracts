[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "osscontrib"
version = "0.1.0"
description = "Contract-based tool orchestration for LangGraph: static validation + provably-safe parallelization"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Habib Ur Rehman" }]
dependencies = ["pydantic>=2.0", "langchain-core>=0.3", "langgraph>=1.0"]

[project.urls]
Homepage = "https://github.com/habib-analyst/langgraph-contracts"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
